components:
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            trace_id:
              type: string
            details: {}
          required:
            - code
            - message
            - trace_id
          additionalProperties: false
      required:
        - error
      additionalProperties: false
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie set at sign-in. Server-side sessions.
    cronSecret:
      type: http
      scheme: bearer
      description: "Vercel cron: `Authorization: Bearer $CRON_SECRET` (constant-time compared)."
    googleOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google Pub/Sub push OIDC token, verified asymmetrically.
