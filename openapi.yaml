openapi: 3.1.0
info:
  title: Tartly API
  version: 0.1.0
  description: AI email operator over Gmail + Google Calendar. Cookie-session auth, `{ data }` / `{ data, pagination }` / `{ error }` envelopes.
servers:
  - url: https://apemail.ariyaman.in
    description: Production
  - url: http://localhost:3000
    description: Local
tags:
  - name: activity
  - name: agent
  - name: ai
  - name: assets
  - name: auth
  - name: autopilot
  - name: billing
  - name: briefing
  - name: campaigns
  - name: commitments
  - name: cron
  - name: drafts
  - name: followups
  - name: health
  - name: inbox
  - name: mail
  - name: meetings
  - name: metrics
  - name: onboarding
  - name: runs
  - name: security
  - name: settings
  - name: threads
  - name: webhooks
paths:
  /api/ai/assistant:
    post:
      operationId: aiAssistant
      tags:
        - ai
      summary: Stream an assistant answer about mail/calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum:
                    - mail
                    - calendar
                question:
                  type: string
                  minLength: 1
                  maxLength: 4000
                context:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
              required:
                - scope
                - question
      responses:
        "200":
          description: SSE answer stream.
          content:
            text/event-stream: {}
        "400":
          description: Syntactic validation failure (invalid body/query).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Authenticated but not permitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: State conflict (duplicate/unique violation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Semantic validation failure (domain rule).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded; see `Retry-After`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Unhandled server error (redacted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      security:
        - sessionCookie: []
