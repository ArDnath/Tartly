name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Non-secret placeholders that satisfy the Zod env schema (`lib/env.ts`) so the
# build and the DB-backed smoke suite can run without production credentials.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci-google-client-id
  GOOGLE_CLIENT_SECRET: ci-google-client-secret
  UPSTASH_REDIS_REST_URL: https://upstash.invalid
  UPSTASH_REDIS_REST_TOKEN: ci-upstash-token

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the breaking-change check can read the spec at the
          # PR merge-base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: OpenAPI spec is in sync with the contract registry
        run: npm run openapi:check

      - name: OpenAPI breaking-change check
        if: github.event_name == 'pull_request'
        run: |
          base="$(git merge-base HEAD origin/${{ github.base_ref }})"
          if git cat-file -e "$base:openapi.yaml" 2>/dev/null; then
            git show "$base:openapi.yaml" > /tmp/openapi-base.yaml
            npm run openapi:breaking -- --base /tmp/openapi-base.yaml --head openapi.yaml
          else
            echo "No openapi.yaml at the merge-base; skipping breaking-change check."
          fi

      - name: Unit tests & coverage gate
        run: npm run test:coverage

      - name: Integration tests (Testcontainers Postgres)
        run: npm run test:integration

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Smoke & eval suite
        run: npm test

      - name: Production build
        run: npm run build

      # Non-blocking on day one: advisory transitive CVEs should be triaged,
      # not block every PR. Tighten to blocking once the tree is clean.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Proves the multi-stage Dockerfile (Phase D6) builds from a clean tree:
      # `npm ci` against the committed lockfile + `next build` + the minimal,
      # non-root standalone runtime.
      - name: Build (runner target)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: app-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (worker target)
        run: docker build --target worker -t app-server-worker:${{ github.sha }} .
